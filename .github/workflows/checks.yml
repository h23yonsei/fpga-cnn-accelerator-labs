name: checks

# Re-runs every simulation in the repository with Icarus Verilog, and the CNN golden model against
# the course's reference logits, on every push.
on:
  push:
  pull_request:

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Icarus Verilog and NumPy
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          pip install numpy
      - name: CNN golden model reproduces the course reference
        run: python tools/cnn_reference.py --check-spec
      - name: All eighteen testbenches
        run: python tools/run_sims.py --sim icarus
      - name: Committed test vectors match a fresh regeneration
        run: git diff --exit-code
